[project]
name = "csfle-gen"
version = "0.1.0"
description = "Interactive CLI generator for CSFLE client projects"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
csfle-gen = "csfle_gen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csfle_gen"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
